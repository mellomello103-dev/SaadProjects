<!doctype html>
<html>
  <head>
    <title>Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      #text,
      .center-button {
        animation-name: success;
        animation-duration: 2s;
        font-style: italic;
      }

      @keyframes success {
        from {
          opacity: 0;
          transform: translateY(23px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      
      .center-button {
        display: flex;
        justify-content: center; 
        margin-top: 20px; 
      }
    </style>
  </head>

  <body style="background-color: whitesmoke">
    <div class="container text-center" style="margin-top: 10%; align-items: center">
      <h1 id="text">Logged in successfully!</h1>
      <p id="text">Welcome, {{ request.user.username }}!</p>

      <!-- الزر متمركز -->
      <div class="center-button">
        <a
          href="{% url 'myFirstapp:login' %}"
          class="btn btn-danger"
        >
          Logout
        </a>
      </div>
    </div>
  </body>
</html>
